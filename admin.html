<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Panel de administración | Oasis Rent A Car</title>
<meta name="description" content="Panel de administración de Oasis Rent A Car. Gestiona el stock de vehículos, precios y ajustes.">
<link rel="preload" as="image" href="img/logo.svg">
<link rel="icon" href="img/logo-oficial.png" type="image/png">
<link rel="stylesheet" href="css/style.min.css">
<link rel="stylesheet" href="css/responsive.min.css">
<link rel="stylesheet" href="css/animations.min.css">
</head>
<body class="admin-page">

<div class="adm">
  <header class="adm-top">
    <a href="index.html"><span class="logo"><img src="img/logo.svg" alt="OASIS Rent a Car"></span></a>
    <div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Panel Oasis</h1></div>
    <a class="btn btn-ghost btn-sm" href="index.html">VER LA WEB →</a>
  </header>

  <nav class="adm-tabs" id="admTabs" aria-label="Secciones del panel">
    <button class="on" data-go="inicio">INICIO</button>
    <button data-go="stock">VEHÍCULOS / STOCK</button>
    <button data-go="add">+ AGREGAR VEHÍCULO</button>
  </nav>

  <!-- 1. INICIO -->
  <section class="adm-pane on" id="pane-inicio">
    <div class="adm-stats" id="admStats"></div>
    <div class="adm-card">
      <div class="adm-card-head"><h2>Próximas reservas</h2><span class="adm-pill">3 próximas</span></div>
      <div id="admReservas"></div>
      <button class="btn btn-orange" data-go="stock" style="margin-top:1.2rem">VER STOCK →</button>
    </div>
    <div class="adm-card">
      <div class="adm-card-head"><h2>Ajustes</h2></div>
      <div class="fgrp"><label>WhatsApp</label><input class="input" id="admWa" placeholder="+1 (809) 693-0840"></div>
      <div class="fgrp"><label>Link de PayPal</label><input class="input" id="admPaypal" placeholder="https://www.paypal.com/..."></div>
      <button class="btn btn-orange" id="admSave" style="margin-top:1rem">GUARDAR AJUSTES</button>
    </div>
  </section>

  <!-- 2. VEHÍCULOS / STOCK -->
  <section class="adm-pane" id="pane-stock">
    <div class="adm-card">
      <div class="adm-card-head"><h2>Vehículos / Stock</h2><span class="adm-pill" id="admCount">0 vehículos</span></div>
      <input class="input" id="admSearch" placeholder="Buscar por nombre...">
      <div class="adm-chips" id="admFilters">
        <button class="chip on" data-filter="Todos">Todos</button>
        <button class="chip" data-filter="Disponible">Disponibles</button>
        <button class="chip" data-filter="Alquilado">Alquilados</button>
        <button class="chip" data-filter="Mantenimiento">Mantenimiento</button>
      </div>
      <div class="adm-list" id="admList"></div>
    </div>
  </section>

  <!-- 3. AGREGAR VEHÍCULO -->
  <section class="adm-pane" id="pane-add">
    <div class="adm-card">
      <div class="adm-card-head"><h2>+ Agregar vehículo</h2></div>
      <form id="admAddForm">
        <div class="fgrp"><label>1. Nombre del vehículo</label><input class="input" id="vNombre" required placeholder="Ej. Toyota Corolla 2024"></div>
        <div class="fgrp"><label>2. Precio US$/día</label><input class="input" id="vPrecio" type="number" min="1" value="100" required></div>
        <div class="fgrp"><label>3. Categoría</label><select class="input" id="vCat"><option>SUV</option><option>Lujo</option><option>Económico</option><option>Jeep</option><option>Familiar</option></select></div>
        <div class="fgrp"><label>4. Foto</label>
          <div class="adm-photo-opts">
            <input class="input" type="file" id="vFile" accept="image/*">
            <button class="btn btn-ghost btn-sm" type="button" id="vGalleryBtn">Elegir de galería</button>
          </div>
          <select class="input" id="vGallery" style="display:none;margin-top:.5rem"></select>
          <img class="thumb" id="vPreview" src="img/sin-foto.webp" alt="Vista previa del vehículo">
        </div>
        <div class="fgrp"><label>5. Estado</label><select class="input" id="vEstado"><option>Disponible</option><option>Alquilado</option><option>Mantenimiento</option></select></div>
        <div class="fgrp"><label>6. Stock</label><input class="input" id="vStock" type="number" min="0" value="1"></div>
        <button class="btn btn-orange adm-big" type="submit">AGREGAR VEHÍCULO →</button>
      </form>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="js/catalog.min.js"></script>
<script src="js/paypal.min.js"></script>
<script src="js/editor.min.js"></script>
<script src="js/admin-panel.min.js"></script>
<script src="js/i18n.min.js"></script>
<script src="js/theme.min.js"></script>
</body>
</html>
